name: Siteline
description: >-
  Siteline is billing and accounts receivable software built specifically for
  commercial subcontractors (trade contractors). It centralizes pay applications
  (including AIA G702/G703 progress billing), lien waivers, lien rights,
  compliance documents, change orders, collections, and A/R reporting in one
  workflow, replacing the spreadsheets, PDFs, and GC payment-portal logins that
  AP/AR teams juggle every month. Siteline integrates with construction
  accounting systems (Sage, Foundation, Viewpoint/Vista, Spectrum, QuickBooks,
  Acumatica, Sage Intacct, NetSuite, CMiC, and others) and with GC payment
  portals (Textura, GCPay, Procore Pay) so billing data flows without double
  entry. Founded in 2019 by Claire Wilson and Gloria Lin, backed by Menlo
  Ventures and First Round Capital; subcontractors have billed over $10B across
  200,000+ projects on the platform. Siteline publishes no public developer API
  — integrations are managed connections rather than a self-serve API.
